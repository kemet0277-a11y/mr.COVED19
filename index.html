<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐛 AbdoxHunter - الثغرات الأمنية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: linear-gradient(45deg, #ff6b6b, #feca57);
            --dark: #0f0f23;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--dark); 
            color: #e8e8e8; 
            line-height: 1.7; 
        }
        
        /* Header */
        header { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(15,15,35,0.98); 
            backdrop-filter: blur(25px); 
            z-index: 1000; 
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 5%;
        }
        .header-content { 
            max-width: 1400px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            font-size: 2.2rem; 
            font-weight: 900; 
            background: var(--primary); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .user-actions { display: flex; gap: 1rem; }
        .admin-btn { 
            background: var(--primary); 
            color: white; 
            padding: 0.8rem 1.5rem; 
            border-radius: 25px; 
            text-decoration: none; 
            font-weight: 600; 
            transition: all 0.3s; 
        }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,107,0.4); }
        
        /* Main Content */
        main { margin-top: 80px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; }
        
        /* Hero */
        .hero { 
            text-align: center; 
            padding: 6rem 2rem 4rem; 
            background: radial-gradient(ellipse at center, rgba(255,107,107,0.1) 0%, transparent 70%);
        }
        .hero h1 { 
            font-size: clamp(3rem, 8vw, 5.5rem); 
            font-weight: 900; 
            background: var(--primary); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 1rem; 
        }
        .hero-subtitle { 
            font-size: 1.6rem; 
            opacity: 0.95; 
            max-width: 800px; 
            margin: 0 auto 3rem; 
        }
        
        /* Stats */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 2rem; 
            margin: 4rem 0; 
        }
        .stat-card { 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 25px; 
            padding: 2.5rem 2rem; 
            text-align: center; 
            transition: all 0.3s; 
        }
        .stat-card:hover { transform: translateY(-8px); border-color: rgba(255,107,107,0.3); }
        .stat-icon { font-size: 3.5rem; margin-bottom: 1rem; background: var(--primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-number { font-size: 3rem; font-weight: 900; color: #feca57; margin-bottom: 0.5rem; }
        
        /* Vulns */
        .vulns-section { padding: 4rem 0; }
        .section-header { text-align: center; margin-bottom: 3rem; }
        .section-title { 
            font-size: clamp(2.2rem, 5vw, 3.5rem); 
            font-weight: 900; 
            background: var(--primary); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 1rem; 
        }
        .stats-display { font-size: 1.4rem; color: #feca57; }
        #searchInput { 
            display: block; 
            margin: 2rem auto 3rem; 
            padding: 1.2rem 2.5rem; 
            width: min(500px, 90vw); 
            border: 2px solid var(--glass-border); 
            border-radius: 50px; 
            background: var(--glass); 
            color: white; 
            font-size: 1.2rem; 
            text-align: center; 
            font-family: inherit;
        }
        #searchInput:focus { border-color: #ff6b6b; box-shadow: 0 0 20px rgba(255,107,107,0.3); }
        
        .vulns-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); 
            gap: 2rem; 
        }
        .vuln-card { 
            background: var(--glass); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            border-radius: 25px; 
            padding: 2.5rem; 
            transition: all 0.4s; 
            cursor: pointer; 
        }
        .vuln-card:hover { 
            transform: translateY(-10px); 
            border-color: rgba(255,107,107,0.4); 
            box-shadow: 0 25px 50px rgba(255,107,107,0.2); 
        }
        .vuln-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
        .vuln-title { font-size: 1.6rem; font-weight: 700; color: #feca57; margin-bottom: 0.5rem; }
        .vuln-severity { 
            padding: 0.5rem 1.2rem; 
            border-radius: 20px; 
            font-size: 0.9rem; 
            font-weight: 700; 
        }
        .severity-low { background: rgba(0,184,148,0.3); color: #00b894; }
        .severity-medium { background: rgba(255,165,0,0.3); color: #ffa502; }
        .severity-high { background: rgba(255,107,107,0.3); color: #ff6b6b; }
        .severity-critical { background: rgba(231,76,60,0.4); color: #e74c3c; }
        .vuln-meta { 
            display: flex; 
            gap: 1rem; 
            font-size: 0.95rem; 
            opacity: 0.85; 
            margin-bottom: 1.5rem; 
            flex-wrap: wrap; 
        }
        .vuln-poc { 
            background: rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            padding: 1.5rem; 
            font-family: 'Courier New', monospace; 
            font-size: 0.95rem; 
            color: #74b9ff; 
            white-space: pre-wrap; 
            overflow-x: auto; 
            line-height: 1.6; 
        }
        
        /* Admin Panel */
        .admin-panel { 
            position: fixed; 
            top: 100px; 
            right: -500px; 
            width: 500px; 
            height: calc(100vh - 120px); 
            background: rgba(15,15,35,0.98); 
            backdrop-filter: blur(30px); 
            border-left: 1px solid var(--glass-border); 
            transition: right 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            z-index: 9999; 
            overflow-y: auto; 
            padding: 2rem; 
        }
        .admin-panel.open { right: 0; }
        .admin-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 2rem; 
            padding-bottom: 1rem; 
            border-bottom: 1px solid var(--glass-border); 
        }
        .admin-title { font-size: 1.8rem; font-weight: 700; color: #feca57; }
        .close-admin { 
            background: none; 
            border: none; 
            font-size: 1.5rem; 
            color: #ff4757; 
            cursor: pointer; 
        }
        .admin-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .admin-form .form-group { margin-bottom: 0; }
        .admin-form input, .admin-form textarea { background: rgba(255,255,255,0.1); }
        .admin-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .btn-small { padding: 0.8rem 1.5rem; font-size: 0.95rem; flex: 1; }
        .btn-danger { background: linear-gradient(45deg, #ff4757, #ff6b6b); }
        .btn-success { background: linear-gradient(45deg, #00b894, #00cec9); }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 1rem; }
            .vulns-grid { grid-template-columns: 1fr; }
            .vuln-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .admin-panel { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-skull-crossbones"></i> AbdoxHunter
            </div>
            <div class="user-actions">
                <a href="#" class="admin-btn" onclick="toggleAdmin()">
                    <i class="fas fa-cog"></i> لوحة الإدارة
                </a>
            </div>
        </div>
    </header>

    <!-- Admin Panel (مخفي) -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <h2 class="admin-title">
                <i class="fas fa-cogs"></i> لوحة الإدارة
            </h2>
            <button class="close-admin" onclick="toggleAdmin()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="admin-form">
            <h3>➕ نشر ثغرة جديدة</h3>
            <div class="form-group">
                <label>العنوان</label>
                <input type="text" id="adminTitle">
            </div>
            <div class="form-group">
                <label>الرابط</label>
                <input type="url" id="adminUrl">
            </div>
            <div class="form-group">
                <label>النوع</label>
                <select id="adminType">
                    <option value="SQL Injection">SQL Injection</option>
                    <option value="XSS">XSS</option>
                    <option value="CSRF">CSRF</option>
                    <option value="LFI/RFI">LFI/RFI</option>
                    <option value="IDOR">IDOR</option>
                </select>
            </div>
            <div class="form-group">
                <label>الخطورة</label>
                <select id="adminSeverity">
                    <option value="low">منخفضة</option>
                    <option value="medium">متوسطة</option>
                    <option value="high">عالية</option>
                    <option value="critical">حرجة</option>
                </select>
            </div>
            <div class="form-group">
                <label>PoC / الكود</label>
                <textarea id="adminPoc" rows="4"></textarea>
            </div>
            <div class="admin-actions">
                <button class="btn-small btn-success" onclick="addAdminVuln()">
                    <i class="fas fa-plus"></i> نشر
                </button>
                <button class="btn-small btn-danger" onclick="clearAllData()">
                    <i class="fas fa-trash"></i> مسح الكل
                </button>
                <button class="btn-small" onclick="exportData()" style="background:linear-gradient(45deg,#48dbfb,#00cec9);">
                    <i class="fas fa-download"></i> تصدير
                </button>
            </div>
        </div>
    </div>

    <!-- Hero -->
    <section class="hero">
        <h1>🐛 AbdoxHunter</h1>
        <p class="hero-subtitle">أحدث الثغرات الأمنية المكتشفة والمنشورة من قبل الباحثين الأمنيين</p>
    </section>

    <!-- Stats -->
    <section class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-bug stat-icon"></i>
                <div class="stat-number" id="totalVulns">0</div>
                <p>ثغرة منشورة</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-fire stat-icon"></i>
                <div class="stat-number" id="criticalCount">0</div>
                <p>ثغرات حرجة</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-eye stat-icon"></i>
                <div class="stat-number" id="totalViews">0</div>
                <p>إجمالي المشاهدات</p>
            </div>
        </div>
    </section>

    <!-- Vulnerabilities -->
    <section id="vulns" class="vulns-section">
        <div class="container">
            <div class="section-header">
                <h2 class="section-title">📋 آخر الثغرات الأمنية</h2>
                <div class="stats-display">
                    تم العثور على <span id="vulnCount">0</span> ثغرة
                </div>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 ابحث بالعنوان، النوع، أو الكود...">
            <div class="vulns-grid" id="vulnsGrid"></div>
        </div>
    </section>

    <script>
        // 🔥 AbdoxHunter - LocalStorage + Admin Panel كامل
        const ADMIN_PASSWORD = 'abdox2024'; // غيّر كلمة المرور هنا
        let vulns = JSON.parse(localStorage.getItem('abdox_vulns') || '[]');
        let isAdminAuthenticated = localStorage.getItem('abdox_admin') === 'true';
        
        // Toggle Admin Panel
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (!isAdminAuthenticated) {
                const password = prompt('🔐 كلمة مرور الإدارة:');
                if (password === ADMIN_PASSWORD) {
                    isAdminAuthenticated = true;
                    localStorage.setItem('abdox_admin', 'true');
                } else {
                    alert('❌ كلمة المرور خاطئة!');
                    return;
                }
            }
            panel.classList.toggle('open');
        }
        
        // Admin: نشر ثغرة
        function addAdminVuln() {
            const vulnData = {
                id: Date.now(),
                title: document.getElementById('adminTitle').value || 'ثغرة بدون عنوان',
                url: document.getElementById('adminUrl').value || '#',
                type: document.getElementById('adminType').value,
                severity: document.getElementById('adminSeverity').value,
                poc: document.getElementById('adminPoc').value,
                date: new Date().toLocaleString('ar-EG'),
                views: 0,
                admin_added: true
            };
            
            vulns.unshift(vulnData);
            localStorage.setItem('abdox_vulns', JSON.stringify(vulns.slice(0, 500)));
            loadVulns();
            updateStats();
            
            // مسح النموذج
            document.getElementById('adminTitle').value = '';
            document.getElementById('adminUrl').value = '';
            document.getElementById('adminPoc').value = '';
            
            alert('✅ تم نشر الثغرة بنجاح!');
        }
        
        // مسح كل البيانات (Admin Only)
        function clearAllData() {
            if (confirm('⚠️ هل أنت متأكد؟ سيتم حذف جميع الثغرات!')) {
                localStorage.removeItem('abdox_vulns');
                vulns = [];
                loadVulns();
                updateStats();
                alert('🗑️ تم مسح كل البيانات!');
            }
        }
        
        // تصدير JSON
        function exportData() {
            const data = JSON.stringify(vulns, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `abdoxhunter-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // تحميل الثغرات
        function loadVulns(searchTerm = '') {
            const grid = document.getElementById('vulnsGrid');
            const count = document.getElementById('vulnCount');
            
            let filtered = vulns.filter(v => {
                const term = searchTerm.toLowerCase();
                return !term || 
                       v.title.toLowerCase().includes(term) ||
                       v.type.toLowerCase().includes(term) ||
                       v.poc.toLowerCase().includes(term) ||
                       v.url.toLowerCase().includes(term);
            });
            
            count.textContent = filtered.length;
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:4rem;color:#666;">
                        <i class="fas fa-search fa-4x" style="margin-bottom:1rem;opacity:0.5;"></i>
                        <h3>لا توجد ثغرات مطابقة</h3>
                        <p>جرب كلمات بحث مختلفة</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filtered.map(v => createVulnCard(v)).join('');
        }
        
        function createVulnCard(vuln) {
            const severityClass = `severity-${vuln.severity || 'medium'}`;
            const severityColor = getSeverityColor(vuln.severity || 'medium');
            
            return `
                <div class="vuln-card ${severityClass}" onclick="viewVuln('${vuln.id}')">
                    <div class="vuln-header">
                        <h3 class="vuln-title">${escapeHtml(vuln.title)}</h3>
                        <span class="vuln-severity ${severityClass}" style="border:1px solid ${severityColor}">${vuln.severity?.toUpperCase()}</span>
                    </div>
                    <div class="vuln-meta">
                        <span><i class="fas fa-globe"></i> ${shortenUrl(vuln.url)}</span>
                        <span><i class="fas fa-bug"></i> ${vuln.type}</span>
                        <span><i class="fas fa-clock"></i> ${vuln.date}</span>
                        <span><i class="fas fa-eye"></i> ${vuln.views || 0}</span>
                    </div>
                    <div class="vuln-poc">${escapeHtml(vuln.poc)}</div>
                </div>
            `;
        }
        
        // عرض تفاصيل الثغرة
        function viewVuln(id) {
            const vuln = vulns.find(v => v.id == id);
            if (vuln) {
                vuln.views = (vuln.views || 0) + 1;
                localStorage.setItem('abdox_vulns', JSON.stringify(vulns));
                loadVulns(document.getElementById('searchInput').value);
                updateStats();
                
                // Popup Modal
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.onclick = () => modal.remove();
                modal.innerHTML = `
                    <div class="modal-content" onclick="event.stopPropagation()">
                        <button class="close-modal" onclick="this.closest('.modal-overlay').remove()">×</button>
                        <h2 style="color:#feca57;margin-bottom:1.5rem;">${escapeHtml(vuln.title)}</h2>
                        <div style="display:grid;gap:1rem;font-size:1.1rem;margin-bottom:2rem;opacity:0.9;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));">
                            <div><strong>🔗 الرابط:</strong> <a href="${vuln.url}" target="_blank" style="color:#74b9ff;">${vuln.url}</a></div>
                            <div><strong>🐛 النوع:</strong> ${vuln.type}</div>
                            <div style="color:${getSeverityColor(vuln.severity)}"><strong>⚠️ الخطورة:</strong> ${vuln.severity}</div>
                            <div><strong>📅 التاريخ:</strong> ${vuln.date}</div>
                            <div><strong>👁️ المشاهدات:</strong> ${vuln.views}</div>
                        </div>
                        <div style="background:rgba(0,0,0,0.5);padding:2rem;border-radius:15px;font-family:'Courier New';white-space:pre-wrap;font-size:1rem;color:#74b9ff;overflow:auto;line-height:1.6;">${escapeHtml(vuln.poc)}</div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
        }
        
        // البحث
        document.getElementById('searchInput').addEventListener('input', function(e) {
            loadVulns(e.target.value);
        });
        
        // إحصائيات
        function updateStats() {
            document.getElementById('totalVulns').textContent = vulns.length;
            const critical = vulns.filter(v => v.severity === 'critical').length;
            document.getElementById('criticalCount').textContent = critical;
            document.getElementById('totalViews').textContent = vulns.reduce((sum, v) => sum + (v.views || 0), 0);
        }
        
        // وظائف مساعدة
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        function shortenUrl(url) {
            return url.length > 40 ? url.slice(0, 37) + '...' : url;
        }
        function getSeverityColor(severity) {
            const colors = { low: '#00b894', medium: '#ffa502', high: '#ff6b6b', critical: '#e74c3c' };
            return colors[severity] || '#666';
        }
        
        // تحميل عند البداية
        window.addEventListener('load', () => {
            loadVulns();
            updateStats();
        });
        
        // حفظ تلقائي
        setInterval(() => {
            localStorage.setItem('abdox_vulns', JSON.stringify(vulns));
        }, 30000);
    </script>
</body>
</html>
